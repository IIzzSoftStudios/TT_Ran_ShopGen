<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create NPC</title>
    {% include 'partials/theme_head.html' %}
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        h1 {
            font-size: 2.5rem;
            color: black;
            margin-top: 20px;
            margin-bottom: 10px;
            text-align: center;
        }
        .container {
            width: 80%;
            max-width: 600px;
            margin: 20px auto;
            background-color: white;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .info-box {
            background-color: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
        }
        .info-box p {
            margin: 5px 0;
            color: #0d47a1;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .button {
            background-color: purple;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .button:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }
        .button-secondary {
            background-color: #6c757d;
        }
        .button-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <h1>Create NPC</h1>

    <div class="container">
        <form method="POST" action="{{ url_for('gm.gm_create_npc') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="info-box">
                <p><strong>Campaign:</strong> {{ campaign.name }}</p>
                <p><strong>System:</strong> {{ system_type|upper }}</p>
            </div>

            <label for="name">NPC name (optional)</label>
            <input type="text" id="name" name="name" maxlength="100" placeholder="Leave blank for NPC1, NPC2, …">

            <label for="class_name">Class (optional)</label>
            <input type="text" id="class_name" name="class_name" placeholder="Class or archetype (e.g. Fighter, Wizard)">

            <label for="species">Species / ancestry (optional)</label>
            <input type="text" id="species" name="species" placeholder="Species or ancestry (e.g. Human, Elf)">

            <div class="buttons">
                <a href="{{ url_for('gm.gm_view_players') }}" class="button button-secondary">Back</a>
                <button type="submit" class="button">Create NPC</button>
            </div>
        </form>
    </div>
</body>
</html>
