<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password - Econo-Forge</title>
    {% include 'partials/theme_head.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth_pages.css') }}">
</head>
<body class="auth-page">
    {% include 'partials/auth_topbar.html' %}
    <div class="auth-page-wrap">
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-subtitle">We will email a one-time reset code if an account exists for that address.</p>
        <form class="auth-card" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="info-box">
                Enter the email address for your account. We will send a 6-digit code valid for 10 minutes.
            </div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
            <button type="submit">Send reset code</button>
        </form>
        <p><a class="back-link" href="{{ url_for('auth.login') }}">Back to Login</a></p>
    </div>
</body>
</html>
