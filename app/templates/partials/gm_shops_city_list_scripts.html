<script>
    function showDeleteConfirmation(shopId, shopName) {
        const modal = document.getElementById('deleteModal');
        const modalText = document.getElementById('deleteModalText');
        modalText.textContent = 'Are you sure you want to delete ' + shopName + '? This action cannot be undone.';
        modal.classList.add('is-open');
        window.shopIdToDelete = shopId;
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.remove('is-open');
    }

    function confirmDelete() {
        if (window.shopIdToDelete) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/gm/shops/delete/' + window.shopIdToDelete;
            const csrfInput = document.createElement('input');
            csrfInput.type = 'hidden';
            csrfInput.name = 'csrf_token';
            csrfInput.value = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            form.appendChild(csrfInput);
            document.body.appendChild(form);
            form.submit();
        }
    }

    function showCityDeleteConfirmation(cityId, cityName) {
        const modal = document.getElementById('cityDeleteModal');
        const modalText = document.getElementById('cityDeleteModalText');
        modalText.textContent = 'Are you sure you want to delete ' + cityName + '? This action cannot be undone.';
        modal.classList.add('is-open');
        window.cityIdToDelete = cityId;
    }

    function closeCityDeleteModal() {
        document.getElementById('cityDeleteModal').classList.remove('is-open');
    }

    function confirmCityDelete() {
        if (window.cityIdToDelete) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/gm/cities/delete/' + window.cityIdToDelete;
            const csrfInput = document.createElement('input');
            csrfInput.type = 'hidden';
            csrfInput.name = 'csrf_token';
            csrfInput.value = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            form.appendChild(csrfInput);
            document.body.appendChild(form);
            form.submit();
        }
    }

    function applyCityRegionFilter() {
        var sel = document.getElementById('gm-shops-region-filter');
        if (!sel) return;
        var v = sel.value;
        var useFk = sel.getAttribute('data-filter-mode') === 'fk';
        document.querySelectorAll('.gm-shops-city-panel .city-block[data-region]').forEach(function (el) {
            var match;
            if (v === '') {
                match = true;
            } else if (useFk) {
                var rid = el.getAttribute('data-region-id') || '';
                match = rid === String(v);
            } else {
                match = el.getAttribute('data-region') === v;
            }
            el.style.display = match ? '' : 'none';
        });
    }

    function navigateToEditRegion() {
        var sel = document.getElementById('gm-shops-region-filter');
        var tplEl = document.getElementById('gm-region-edit-url-template');
        if (!sel || !tplEl) return;
        var v = sel.value;
        if (!v) {
            alert('Please select a region');
            return;
        }
        var template = tplEl.getAttribute('data-url') || '';
        window.location.href = template.replace('900000001', String(v));
    }

    window.addEventListener('DOMContentLoaded', function () {
        var regionFilter = document.getElementById('gm-shops-region-filter');
        if (regionFilter) {
            regionFilter.addEventListener('change', applyCityRegionFilter);
        }

        document.body.addEventListener('click', function (e) {
            const shopBtn = e.target.closest('.delete-button[data-shop-id]');
            if (shopBtn) {
                var sid = parseInt(shopBtn.getAttribute('data-shop-id'), 10);
                var sname = shopBtn.getAttribute('data-shop-name') || '';
                showDeleteConfirmation(sid, sname);
                return;
            }
            const cityBtn = e.target.closest('.delete-button[data-city-id]');
            if (cityBtn) {
                var cid = parseInt(cityBtn.getAttribute('data-city-id'), 10);
                var cname = cityBtn.getAttribute('data-city-name') || '';
                showCityDeleteConfirmation(cid, cname);
            }
        }, true);
    });

    window.addEventListener('click', function (event) {
        const modal = document.getElementById('deleteModal');
        if (modal && event.target === modal) {
            closeDeleteModal();
        }
        const cityModal = document.getElementById('cityDeleteModal');
        if (cityModal && event.target === cityModal) {
            closeCityDeleteModal();
        }
    });
</script>
